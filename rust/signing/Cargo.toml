[package]
name = "m10-signing"
version = "1.5.2"
authors = ["Michael Wittner <michael.wittner@m10.io>"]
edition = "2021"
description = "M10 utility library for request signing"
license = "MIT"
homepage = "https://docs-app.m10.net"
repository = "https://github.com/m10io/sdk"

[features]
verbose_errors = ["log"]

[dependencies]
async-trait = "0.1"
base64 = "0.13"
ed25519-dalek = { version = "2", default-features = false, features = ["digest", "hazmat", "pkcs8", "rand_core", "std"] }
m10-protos = { version = "1.5", path = "../protos" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "1"
vaultrs = "0.7.4"
url = "=2.5.4"
log = { version = "0.4", optional = true }

[dev-dependencies]
bytes = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
testcontainers = "0.23"
wiremock = "0.5"
